name: Build VCA Bus Compressor (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target VCABusComp_VST3
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/VCABusComp_artefacts/Release/VST3/VCA Bus Compressor.vst3" -DestinationPath VCABusComp-VST3-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VCABusComp-VST3-win64
          path: VCABusComp-VST3-win64.zip
